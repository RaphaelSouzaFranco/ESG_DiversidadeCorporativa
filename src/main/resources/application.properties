spring.application.name=esgdiversidadecorporativa

# Oracle FIAP Integration Settings
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.username=${DB_USER:RM560198}
spring.datasource.password=${DB_PASS:260391}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway is disabled by default to prevent startup errors if there are no db/migration scripts
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
